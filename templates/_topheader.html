<header class="h-20 flex items-center justify-between px-10 shrink-0 sticky top-0 bg-[#0a0a0c]/85 backdrop-blur-md z-30 border-b border-white/5">
  <div class="flex items-center gap-8">
    <!-- Category Pills -->
    <div class="flex items-center gap-5 text-slate-400">
      <a href="{% url 'home' %}" class="text-xs font-bold tracking-wider {% if request.resolver_match.url_name == 'home' %}text-white border-b-2 border-indigo-500 pb-1{% else %}hover:text-white transition-colors{% endif %}">
        MUSIC
      </a>
      <a href="{% url 'catalogue_browse' %}" class="text-xs font-bold tracking-wider {% if request.resolver_match.url_name == 'catalogue_browse' %}text-white border-b-2 border-indigo-500 pb-1{% else %}hover:text-white transition-colors{% endif %}">
        EXPLORE
      </a>
      <a href="{% url 'playlist_list' %}" class="text-xs font-bold tracking-wider {% if request.resolver_match.url_name == 'playlist_list' %}text-white border-b-2 border-indigo-500 pb-1{% else %}hover:text-white transition-colors{% endif %}">
        PLAYLISTS
      </a>
    </div>

    <!-- Search Input Form -->
    <form action="{% url 'catalogue_browse' %}" method="GET" class="relative">
      <iconify-icon icon="lucide:search" class="absolute left-4 top-1/2 -translate-y-1/2 text-slate-500 text-base"></iconify-icon>
      <input type="text" name="q" value="{{ request.GET.q|default:'' }}" placeholder="Type here to search tracks, artists..." class="bg-white/5 border border-white/10 rounded-full py-2.5 pl-11 pr-6 text-xs w-72 md:w-88 focus:w-96 focus:outline-none focus:border-indigo-500 focus:bg-white/10 text-white placeholder-slate-500 transition-all">
    </form>
  </div>

  <!-- Right Actions -->
  <div class="flex items-center gap-3">
    {% if user.is_authenticated %}
      {% if user.profile.role == 'ADMIN' or user.is_staff or user.is_superuser %}
        <a href="{% url 'song_create' %}" class="flex items-center gap-2 bg-indigo-600 hover:bg-indigo-500 text-white px-3.5 py-1.5 rounded-full text-xs font-bold transition-all shadow-md shadow-indigo-600/20">
          <iconify-icon icon="lucide:upload-cloud" class="text-sm"></iconify-icon>
          <span>Upload Song</span>
        </a>
        <a href="{% url 'catalogue_manage' %}" class="flex items-center gap-2 bg-purple-600/15 text-purple-300 hover:bg-purple-600/25 px-3.5 py-1.5 rounded-full text-xs font-bold border border-purple-500/30 transition-colors">
          <iconify-icon icon="lucide:shield-check" class="text-sm"></iconify-icon>
          <span>ADMIN HUB</span>
        </a>
      {% else %}
        <a href="{% url 'dashboard' %}" class="flex items-center gap-2 bg-indigo-600/15 text-indigo-400 hover:bg-indigo-600/25 px-3.5 py-1.5 rounded-full text-xs font-bold border border-indigo-500/30 transition-colors">
          <iconify-icon icon="lucide:sparkles" class="text-sm"></iconify-icon>
          <span>DASHBOARD</span>
        </a>
      {% endif %}
    {% else %}
      <a href="{% url 'login' %}" class="text-xs font-bold text-slate-300 hover:text-white px-3 py-1.5 transition-colors">
        Log In
      </a>
      <a href="{% url 'register' %}" class="bg-indigo-600 hover:bg-indigo-500 text-white px-4 py-1.5 rounded-full text-xs font-bold transition-all shadow-md shadow-indigo-600/20">
        Register
      </a>
    {% endif %}
  </div>
</header>
