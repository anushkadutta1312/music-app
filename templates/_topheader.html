<header class="h-16 md:h-20 flex items-center justify-between px-4 sm:px-6 md:px-10 shrink-0 sticky top-0 bg-[#0a0a0c]/90 backdrop-blur-md z-30 border-b border-white/5 gap-3">
  
  <!-- Left: Mobile Menu Toggle + Logo + Nav Pills -->
  <div class="flex items-center gap-3 sm:gap-6 min-w-0">
    <!-- Mobile Hamburger Button -->
    <button id="sidebar-toggle-btn" type="button" class="lg:hidden text-slate-300 hover:text-white p-2 -ml-1 rounded-xl hover:bg-white/5 transition-colors focus:outline-none shrink-0" aria-label="Open navigation menu">
      <iconify-icon icon="lucide:menu" class="text-2xl block"></iconify-icon>
    </button>

    <!-- Mobile Brand Logo -->
    <a href="{% url 'home' %}" class="lg:hidden flex items-center gap-2 text-white shrink-0 text-decoration-none">
      <div class="w-7 h-7 rounded-lg bg-gradient-to-br from-indigo-500 to-purple-600 flex items-center justify-center shadow-md">
        <iconify-icon icon="lucide:audio-lines" class="text-white text-base"></iconify-icon>
      </div>
      <span class="font-bold text-sm tracking-tight hidden xs:inline">Groovy</span>
    </a>

    <!-- Desktop Category Pills -->
    <div class="hidden md:flex items-center gap-5 text-slate-400">
      <a href="{% url 'home' %}" class="text-xs font-bold tracking-wider {% if request.resolver_match.url_name == 'home' %}text-white border-b-2 border-indigo-500 pb-1{% else %}hover:text-white transition-colors{% endif %}">
        MUSIC
      </a>
      <a href="{% url 'catalogue_browse' %}" class="text-xs font-bold tracking-wider {% if request.resolver_match.url_name == 'catalogue_browse' %}text-white border-b-2 border-indigo-500 pb-1{% else %}hover:text-white transition-colors{% endif %}">
        EXPLORE
      </a>
      <a href="{% url 'playlist_list' %}" class="text-xs font-bold tracking-wider {% if request.resolver_match.url_name == 'playlist_list' %}text-white border-b-2 border-indigo-500 pb-1{% else %}hover:text-white transition-colors{% endif %}">
        PLAYLISTS
      </a>
    </div>

    <!-- Search Input Form -->
    <form action="{% url 'catalogue_browse' %}" method="GET" class="relative min-w-0">
      <iconify-icon icon="lucide:search" class="absolute left-3 md:left-4 top-1/2 -translate-y-1/2 text-slate-500 text-sm md:text-base pointer-events-none"></iconify-icon>
      <input type="text" name="q" value="{{ request.GET.q|default:'' }}" placeholder="Search tracks, artists..." class="bg-white/5 border border-white/10 rounded-full py-1.5 md:py-2.5 pl-9 md:pl-11 pr-4 md:pr-6 text-xs w-36 sm:w-56 md:w-80 focus:w-48 sm:focus:w-72 md:focus:w-96 focus:outline-none focus:border-indigo-500 focus:bg-white/10 text-white placeholder-slate-500 transition-all">
    </form>
  </div>

  <!-- Right Actions -->
  <div class="flex items-center gap-2 sm:gap-3 shrink-0">
    {% if user.is_authenticated %}
      {% if user.profile.role == 'ADMIN' or user.is_staff or user.is_superuser %}
        <a href="{% url 'song_create' %}" class="flex items-center gap-1.5 bg-indigo-600 hover:bg-indigo-500 text-white px-2.5 sm:px-3.5 py-1.5 rounded-full text-xs font-bold transition-all shadow-md shadow-indigo-600/20" title="Upload Song">
          <iconify-icon icon="lucide:upload-cloud" class="text-sm"></iconify-icon>
          <span class="hidden sm:inline">Upload</span>
        </a>
        <a href="{% url 'catalogue_manage' %}" class="hidden sm:flex items-center gap-1.5 bg-purple-600/15 text-purple-300 hover:bg-purple-600/25 px-3 py-1.5 rounded-full text-xs font-bold border border-purple-500/30 transition-colors">
          <iconify-icon icon="lucide:shield-check" class="text-sm"></iconify-icon>
          <span>ADMIN</span>
        </a>
      {% endif %}
      <a href="{% url 'profile' %}" class="w-8 h-8 rounded-full bg-gradient-to-br from-indigo-500 to-purple-600 flex items-center justify-center font-bold text-white text-xs shadow-md border border-white/10" title="{{ user.username }}">
        {{ user.username|slice:":1"|upper }}
      </a>
    {% else %}
      <a href="{% url 'login' %}" class="text-xs font-bold text-slate-300 hover:text-white px-2.5 py-1.5 transition-colors">
        Log In
      </a>
      <a href="{% url 'register' %}" class="bg-indigo-600 hover:bg-indigo-500 text-white px-3 sm:px-4 py-1.5 rounded-full text-xs font-bold transition-all shadow-md shadow-indigo-600/20">
        Register
      </a>
    {% endif %}
  </div>
</header>
