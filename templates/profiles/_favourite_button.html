<form class="inline-flex items-center" method="post" action="{% url 'favourite_action' song.id %}" data-favourite-form {% if remove_card_on_unsave %}data-remove-card-on-unsave="true"{% endif %}>
    {% csrf_token %}
    {% if is_favourited %}
        <input type="hidden" name="action" value="remove">
        <button type="submit" class="p-2 rounded-xl text-rose-500 hover:text-rose-400 hover:bg-rose-500/10 transition-all focus:outline-none" data-favourite-button aria-pressed="true" title="Remove from favourites">
            <iconify-icon icon="lucide:heart" class="text-lg fill-rose-500 text-rose-500 block pointer-events-none"></iconify-icon>
            <span class="sr-only">♥ Remove from favourites</span>
        </button>
    {% else %}
        <input type="hidden" name="action" value="add">
        <button type="submit" class="p-2 rounded-xl text-slate-500 hover:text-rose-500 hover:bg-white/5 transition-all focus:outline-none" data-favourite-button aria-pressed="false" title="Add to favourites">
            <iconify-icon icon="lucide:heart" class="text-lg text-slate-400 hover:text-rose-400 block pointer-events-none"></iconify-icon>
            <span class="sr-only">♡ Add to favourites</span>
        </button>
    {% endif %}
</form>
